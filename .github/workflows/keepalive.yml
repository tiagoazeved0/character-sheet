# Free Supabase projects pause after ~7 days without database activity.
# This pings the project twice a week so the sheet is never asleep at the table.
# Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets when phase 4 lands.
name: Supabase keepalive
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping heartbeat table
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "Supabase not configured yet - skipping."; exit 0
          fi
          curl -sS -o /dev/null -w '%{http_code}\n' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/heartbeat?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
